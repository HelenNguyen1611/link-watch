name: Deploy LinkWatch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # bắt buộc để dùng OIDC
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0 # khớp pnpm trên máy Mac

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Kiểm tra (lỗi thì không deploy)
        run: pnpm lint && pnpm typecheck && pnpm test

      - name: Build web (Next.js static export → apps/web/out)
        run: pnpm --filter @linkwatch/web build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::131746731277:role/linkwatch-github-deploy
          aws-region: ap-southeast-1

      - name: CDK deploy
        run: pnpm --filter @linkwatch/infra exec cdk deploy --all --require-approval never
